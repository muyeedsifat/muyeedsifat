<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="60%" stop-color="#1b1c22"/>
      <stop offset="100%" stop-color="#2a201b"/>
    </linearGradient>
    <linearGradient id="orangeGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7d00"/>
      <stop offset="100%" stop-color="#ffab40"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ff7d00" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#ff7d00" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  
  <rect x="80" y="80" width="130" height="36" rx="18" fill="#ff7d00" fill-opacity="0.18" stroke="#ff7d00" stroke-width="1.5"/>
  <text x="145" y="103" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#ff9e2c" text-anchor="middle" letter-spacing="1">AI SEO</text>

  <text x="80" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="800" fill="#ffffff" letter-spacing="-1">AEO vs GEO vs SEO</text>
  <text x="80" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="url(#orangeGlow)" letter-spacing="-1">The Modern Search Guide</text>
  <text x="80" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#a0a5b5" font-weight="400">Comparing Answer Engines, Generative Models and Classical Search</text>

  <g transform="translate(80, 480)">
    <circle cx="24" cy="24" r="24" fill="#ff7d00"/>
    <text x="24" y="31" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">M</text>
    <text x="64" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Muyeed Sifat</text>
    <text x="64" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#ff9e2c">AI SEO &amp; Search Visibility</text>
  </g>

  <!-- 3 Comparison Boxes on Right -->
  <g transform="translate(820, 200)">
    <rect x="-80" y="0" width="340" height="68" rx="14" fill="#22242c" stroke="#333742" stroke-width="1.5"/>
    <rect x="-66" y="14" width="40" height="40" rx="8" fill="#ff7d00" fill-opacity="0.2"/>
    <text x="-46" y="40" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#ff7d00" text-anchor="middle">AEO</text>
    <text x="-12" y="41" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Answer Engine Optimization</text>

    <rect x="-80" y="85" width="340" height="68" rx="14" fill="#22242c" stroke="#ff7d00" stroke-width="1.8"/>
    <rect x="-66" y="99" width="40" height="40" rx="8" fill="#ff7d00"/>
    <text x="-46" y="125" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">GEO</text>
    <text x="-12" y="126" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Generative Engine Optimization</text>

    <rect x="-80" y="170" width="340" height="68" rx="14" fill="#22242c" stroke="#333742" stroke-width="1.5"/>
    <rect x="-66" y="184" width="40" height="40" rx="8" fill="#ffffff" fill-opacity="0.1"/>
    <text x="-46" y="210" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">SEO</text>
    <text x="-12" y="211" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Search Engine Optimization</text>
  </g>
</svg>
