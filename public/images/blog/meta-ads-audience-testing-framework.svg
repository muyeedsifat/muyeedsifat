<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="60%" stop-color="#1b1c22"/>
      <stop offset="100%" stop-color="#2a201b"/>
    </linearGradient>
    <linearGradient id="orangeGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7d00"/>
      <stop offset="100%" stop-color="#ffab40"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ff7d00" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#ff7d00" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  
  <rect x="80" y="80" width="130" height="36" rx="18" fill="#ff7d00" fill-opacity="0.18" stroke="#ff7d00" stroke-width="1.5"/>
  <text x="145" y="103" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#ff9e2c" text-anchor="middle" letter-spacing="1">META ADS</text>

  <text x="80" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-1">Meta Ads Audience</text>
  <text x="80" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="url(#orangeGlow)" letter-spacing="-1">Testing Framework</text>
  <text x="80" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#a0a5b5" font-weight="400">Scientific creative testing, broad targeting &amp; scaling to 3.4x+ ROAS</text>

  <g transform="translate(80, 480)">
    <circle cx="24" cy="24" r="24" fill="#ff7d00"/>
    <text x="24" y="31" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">M</text>
    <text x="64" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Muyeed Sifat</text>
    <text x="64" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#ff9e2c">Paid Social Strategist</text>
  </g>

  <!-- Audience Testing Nodes on Right -->
  <g transform="translate(850, 310)">
    <!-- Central test node -->
    <rect x="-80" y="-120" width="160" height="60" rx="14" fill="#22242c" stroke="#ff7d00" stroke-width="2"/>
    <text x="0" y="-84" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">Ad Angle (Hook)</text>

    <!-- Connectors -->
    <path d="M-80 -90 L-140 -20 M80 -90 L140 -20 M0 -60 L0 10" stroke="#ff7d00" stroke-width="2" fill="none"/>

    <circle cx="-140" cy="30" r="45" fill="#1b1c22" stroke="#333742" stroke-width="2"/>
    <text x="-140" y="27" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#a0a5b5" text-anchor="middle">Broad</text>
    <text x="-140" y="44" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ff9e2c" text-anchor="middle">Advantage+</text>

    <circle cx="0" cy="55" r="45" fill="#1b1c22" stroke="#ff7d00" stroke-width="2"/>
    <text x="0" y="52" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Lookalike</text>
    <text x="0" y="69" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffab40" text-anchor="middle">1-3% LAL</text>

    <circle cx="140" cy="30" r="45" fill="#1b1c22" stroke="#333742" stroke-width="2"/>
    <text x="140" y="27" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#a0a5b5" text-anchor="middle">Interest</text>
    <text x="140" y="44" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ff9e2c" text-anchor="middle">Stacked</text>
  </g>
</svg>
