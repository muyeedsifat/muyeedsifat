<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121316"/>
      <stop offset="60%" stop-color="#1c1e24"/>
      <stop offset="100%" stop-color="#2a221b"/>
    </linearGradient>
    <linearGradient id="orangeGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7d00"/>
      <stop offset="100%" stop-color="#ffab40"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ff7d00" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff7d00" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  
  <!-- Subtle Grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="630"/>
    <line x1="280" y1="0" x2="280" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="680" y1="0" x2="680" y2="630"/>
    <line x1="880" y1="0" x2="880" y2="630"/>
    <line x1="1080" y1="0" x2="1080" y2="630"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="440" x2="1200" y2="440"/>
  </g>

  <!-- Tag Pill -->
  <rect x="80" y="80" width="130" height="36" rx="18" fill="#ff7d00" fill-opacity="0.18" stroke="#ff7d00" stroke-width="1.5"/>
  <text x="145" y="103" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#ff9e2c" text-anchor="middle" letter-spacing="1">AI SEO</text>

  <!-- Title & Meta -->
  <text x="80" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-1">How Generative AI</text>
  <text x="80" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="url(#orangeGlow)" letter-spacing="-1">Changes Search Results</text>
  <text x="80" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#a0a5b5" font-weight="400">SEO, AEO and GEO frameworks for modern search visibility</text>

  <!-- Author Badge -->
  <g transform="translate(80, 480)">
    <circle cx="24" cy="24" r="24" fill="#ff7d00"/>
    <text x="24" y="31" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">M</text>
    <text x="64" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Muyeed Sifat</text>
    <text x="64" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#ff9e2c">AI SEO &amp; PPC Strategist</text>
  </g>

  <!-- Graphic on the Right -->
  <g transform="translate(850, 315)">
    <circle cx="0" cy="0" r="160" fill="none" stroke="#ff7d00" stroke-width="1.5" stroke-dasharray="6 6" stroke-opacity="0.4"/>
    <circle cx="0" cy="0" r="115" fill="none" stroke="#ffab40" stroke-width="2" stroke-opacity="0.6"/>
    <circle cx="0" cy="0" r="70" fill="#ff7d00" fill-opacity="0.2" stroke="#ff7d00" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="32" fill="url(#orangeGlow)"/>
    <!-- Orbiting nodes -->
    <circle cx="95" cy="-65" r="14" fill="#ffffff" filter="drop-shadow(0 0 8px rgba(255,125,0,0.6))"/>
    <circle cx="-100" cy="55" r="12" fill="#ffab40"/>
    <circle cx="20" cy="115" r="10" fill="#ffffff"/>
    <path d="M-40 -40 L40 40 M-40 40 L40 -40" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
